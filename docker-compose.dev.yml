# 本地开发环境 Docker Compose
# 一键启动：docker compose -f docker-compose.dev.yml up
# 源码挂载 + 热重载，不需要装 .NET SDK 或 Node.js，只需要 Docker。
#
# 注意：数据库不在容器内，连接信息在 appsettings.Development.json 中配置远程 Oracle。

services:
  redis:
    image: redis:8.2.8-alpine
    command:
      - sh
      - -ec
      - |
        exec redis-server \
          --appendonly yes \
          --appendfsync everysec \
          --save 300 10 \
          --maxmemory 192mb \
          --maxmemory-policy noeviction \
          --dir /data \
          --requirepass "$$REDIS_PASSWORD"
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Copy .env.example to .env and set REDIS_PASSWORD}
    volumes:
      - redis-dev-data:/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli --no-auth-warning ping | grep -q PONG',
        ]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    restart: unless-stopped

  backend:
    image: mcr.microsoft.com/dotnet/sdk:10.0
    working_dir: /src
    ports:
      - "5000:5000"
    volumes:
      - .:/src
    command: >
      sh -c "dotnet restore backend/ClubHub.Api.csproj &&
             dotnet watch run --project backend/ClubHub.Api.csproj --urls http://0.0.0.0:5000"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - Redis__Enabled=true
      - Redis__ConnectionString=redis:6379
      - Redis__Username=default
      - Redis__Password=${REDIS_PASSWORD:?Copy .env.example to .env and set REDIS_PASSWORD}
      - Redis__EnvironmentPrefix=dev
      - Redis__Features__Cache=${REDIS_CACHE_ENABLED:-false}
      - Oss__Region=${OSS_REGION:-cn-shanghai}
      - Oss__Endpoint=${OSS_ENDPOINT:-oss-cn-shanghai-internal.aliyuncs.com}
      - Oss__Bucket=${OSS_BUCKET:-}
      - Oss__RoleName=${OSS_ROLE_NAME:-}
    depends_on:
      redis:
        condition: service_healthy

  frontend:
    image: node:22-alpine
    working_dir: /app
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules    # 匿名卷：避免宿主机 node_modules 覆盖容器内版本
    command: >
      sh -c "corepack enable &&
             pnpm install --frozen-lockfile &&
             pnpm run dev --host"
    environment:
      - API_PROXY_TARGET=http://backend:5000
    depends_on:
      - backend

volumes:
  redis-dev-data:
